<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SoloDesk responsive review</title><meta name="robots" content="noindex"><style>body{margin:0;background:#dce1e5;font:13px 'Segoe UI',sans-serif;color:#192b3a}header{padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:white;border-bottom:1px solid #bfcbd3}label{font-size:12px}select{font:inherit;margin-left:10px;padding:5px}iframe{display:block;background:white;border:0;box-shadow:0 10px 40px #10263320;margin:18px auto;width:390px;height:760px;max-width:none}p{margin:0;font-size:11px;color:#72808d}</style></head><body><header><b>SoloDesk · responsive review</b><label>Viewport<select id="width" aria-label="Viewport width"><option>320</option><option selected>390</option><option>360</option><option>430</option><option>768</option><option>1440</option></select></label><label>Page<select id="route" aria-label="Preview page"><option value="dash">dash</option><option value="clients">clients</option><option value="projects">projects</option><option value="tasks">tasks</option><option value="invoices">invoices</option><option value="calendar">calendar</option><option value="reports">reports</option><option value="settings">settings</option><option value="integrations">integrations</option><option value="more">more</option><option value="privacy">privacy</option><option value="cookies">cookies</option></select></label><label>Height<select id="height" aria-label="Viewport height"><option>560</option><option selected>760</option><option>1000</option></select></label><p>Local demo only. Resize the frame to check layouts and controls.</p><output id="metrics" aria-live="polite"></output></header><iframe title="SoloDesk preview" src="/#/dash"></iframe><script>document.querySelector('#route').addEventListener('change',event=>document.querySelector('iframe').contentWindow.location.hash='/'+event.target.value);document.querySelector('#width').addEventListener('change',event=>document.querySelector('iframe').style.width=event.target.value+'px')
const frame=document.querySelector('iframe'), metrics=document.querySelector('#metrics');
document.querySelector('#height').addEventListener('change',event=>{frame.style.height=event.target.value+'px';requestAnimationFrame(measure)});
let observer;
function measure(){
  const d=frame.contentDocument,w=frame.contentWindow.innerWidth;
  const overflowing=[...d.querySelectorAll('main *,header *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>1&&r.right>w+1&&getComputedStyle(e).position!=='absolute'&&!e.closest('.tw,.legal-table-wrap')});
  metrics.textContent=JSON.stringify({page:d.title,width:w,scrollWidth:d.documentElement.scrollWidth,overflow:overflowing.slice(0,8).map(e=>({tag:e.tagName,class:e.getAttribute('class'),right:Math.round(e.getBoundingClientRect().right)}))});
}
frame.addEventListener('load',()=>{observer?.disconnect();observer=new MutationObserver(()=>requestAnimationFrame(measure));observer.observe(frame.contentDocument.documentElement,{subtree:true,childList:true,attributes:true});requestAnimationFrame(measure)});
document.querySelector('#width').addEventListener('change',()=>requestAnimationFrame(measure));
</script></body></html>
